name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest tests/unit_tests --disable-socket --allow-unix-socket --cov=langchain_context --cov-report=term-missing
      - run: uv build
      - run: uv run twine check dist/*
